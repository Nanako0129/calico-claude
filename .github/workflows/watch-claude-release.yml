name: Watch Claude Code Releases

on:
  # GitHub does not honour this cadence; it is an upper bound on how often the
  # schedule is *considered*. Observed firing on this repo: roughly hourly but
  # always 30-50 minutes late, then degrading to 2.3h, 4.3h, 10.3h and 10.7h
  # gaps over 2026-08-26/27, which left a merged 2.1.247 compat fix unreleased
  # for hours. Asking every 15 minutes does not make GitHub punctual, it just
  # gives four chances per hour instead of one. Every run past the first is a
  # ~15s no-op: the release-existence check short-circuits before checkout.
  schedule:
    - cron: "*/15 * * * *"
  # The schedule is a backstop, not the primary trigger. A compat fix landing on
  # main is the event that should release, and it is observable immediately, so
  # do not wait for a cron that may skip ten hours. Safe to fire on every push:
  # the job no-ops when the releases already exist, when a patch run is already
  # active, and never dispatches unless the preflight patch+verify passes.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  PATCH_WORKFLOW_FILE: patch-claude.yml

concurrency:
  group: watch-claude-release
  cancel-in-progress: false

jobs:
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  dispatch-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Get latest Claude version from npm
        id: latest
        run: |
          set -euo pipefail
          VERSION="$(npm view @anthropic-ai/claude-code dist-tags.latest --silent)"
          if [ -z "$VERSION" ]; then
            echo "npm did not return a Claude version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest Claude version: $VERSION"

      - name: Skip if patch workflow is already running
        id: active
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE_RUNS="$(gh run list \
            --branch "$DEFAULT_BRANCH" \
            --workflow "$PATCH_WORKFLOW_FILE" \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status != "completed")] | length')"

          if [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Patch workflow already has an active run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether patched releases already exist
        if: steps.active.outputs.skip != 'true'
        id: releases
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          MISSING=0

          for SUFFIX in linux-x64 linux-arm64 macos-arm64 win32-x64 win32-arm64; do
            TAG="v${VERSION}-${SUFFIX}"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Found $TAG"
            else
              echo "Missing $TAG"
              MISSING=1
            fi
          done

          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

      # Gate the release on a cheap patch+verify of one platform first. Without
      # it, upstream drift is only discovered when the release run fails on all
      # five platforms, after the tags have already been attempted. One platform
      # is not proof for the others — minified locals differ per build, and the
      # release run still verifies each — but every drift seen so far has shown
      # up identically everywhere, so this catches it a full release earlier and
      # names the module.
      - name: Check out the patcher
        if: steps.active.outputs.skip != 'true' && steps.releases.outputs.missing == '1'
        uses: actions/checkout@v5

      - name: Install dependencies
        if: steps.active.outputs.skip != 'true' && steps.releases.outputs.missing == '1'
        run: npm ci

      - name: Verify the patcher against the new version
        id: preflight
        if: steps.active.outputs.skip != 'true' && steps.releases.outputs.missing == '1'
        continue-on-error: true
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          DISABLED_MODULES: tool-call-verbose
        run: |
          set -euo pipefail

          bash scripts/download-native-from-installer.sh \
            --platform linux-x64 \
            --version "$VERSION" \
            --output work/preflight.original \
            --manifest-out work/preflight-manifest.json

          cp work/preflight.original work/preflight.patched
          chmod +x work/preflight.patched

          node scripts/patch-native.ts \
            --input work/preflight.patched \
            --disable "$DISABLED_MODULES" \
            --assert-all

          node scripts/verify-patched-binary.ts \
            --input work/preflight.patched \
            --disable "$DISABLED_MODULES"

          work/preflight.patched --version | tee work/preflight-version.txt
          grep -F "(patched)" work/preflight-version.txt

      - name: Report drift and stop
        if: steps.preflight.outcome == 'failure'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          echo "The patcher does not cleanly handle Claude $VERSION yet, so no release was dispatched." >&2
          echo "See the preflight step above for the module that drifted." >&2
          exit 1

      - name: Dispatch patch workflow
        if: steps.active.outputs.skip != 'true' && steps.releases.outputs.missing == '1' && steps.preflight.outcome == 'success'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "$PATCH_WORKFLOW_FILE" \
            -f native_version="${{ steps.latest.outputs.version }}"
          echo "Dispatched patch workflow for version ${{ steps.latest.outputs.version }}"

      - name: No action needed
        if: steps.active.outputs.skip == 'true' || steps.releases.outputs.missing != '1'
        run: |
          set -euo pipefail
          if [ "${{ steps.active.outputs.skip }}" = "true" ]; then
            echo "No action needed while patch workflow is already running."
          else
            echo "All platform releases already exist for ${{ steps.latest.outputs.version }}."
          fi
