name: Discord CI Notify

# Posts watcher failures to the community Discord's #github channel.
#
# Scope (deliberate, after observing 2026-08-31 run behavior):
#   - "Watch Claude Code Releases": failure ONLY — it fires every 15 minutes
#     by cron plus on every push and almost every run is a ~15s no-op, so
#     success notifications would flood the channel.
#   - "Patch Claude Native" is NOT handled here and cannot be: the watcher
#     dispatches it with the repo GITHUB_TOKEN, and GitHub suppresses events
#     created by GITHUB_TOKEN-triggered runs (anti-recursion), so its
#     completion never fires workflow_run. Verified empirically: run
#     17368… (2026-08-31 06:32 UTC) completed with this file on main and
#     triggered nothing. Patch outcomes are covered instead by:
#       success → release published → repo webhook announces it
#       failure → notify-failure job inside patch-claude.yml itself
#
# Requires the DISCORD_WEBHOOK repo secret: a plain Discord webhook URL
# (https://discord.com/api/webhooks/<id>/<token> — no /github suffix; the
# payload below is a native Discord embed, not a GitHub event).

on:
  workflow_run:
    workflows:
      - "Watch Claude Code Releases"
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Post CI status to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set; cannot notify" && exit 1
          fi
          jq -n \
            --arg title "❌ $RUN_NAME #$RUN_NUMBER — $CONCLUSION" \
            --arg url "$RUN_URL" \
            --arg desc "calico-claude · \`$BRANCH\` · \`${SHA:0:7}\`" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15158332}]}' \
          | curl -sfS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
