name: Discord CI Notify

# Posts CI status to the community Discord's #github channel.
#
# Notification policy (deliberate, to keep the channel readable):
#   - "Patch Claude Native": notify on success AND failure — this is the real
#     build/release pipeline, both outcomes are signal.
#   - "Watch Claude Code Releases": notify on failure ONLY — it fires every
#     15 minutes by cron plus on every push, and almost every run is a ~15s
#     no-op; success notifications would flood the channel.
#   - cancelled/skipped runs are never reported.
#
# Requires the DISCORD_WEBHOOK repo secret: a plain Discord webhook URL
# (https://discord.com/api/webhooks/<id>/<token> — no /github suffix; the
# payload below is a native Discord embed, not a GitHub event).

on:
  workflow_run:
    workflows:
      - "Patch Claude Native"
      - "Watch Claude Code Releases"
    types: [completed]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'Patch Claude Native')
    runs-on: ubuntu-latest
    steps:
      - name: Post CI status to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set; cannot notify" && exit 1
          fi
          if [ "$CONCLUSION" = "success" ]; then
            icon="✅"; color=3066993
          else
            icon="❌"; color=15158332
          fi
          jq -n \
            --arg title "$icon $RUN_NAME #$RUN_NUMBER — $CONCLUSION" \
            --arg url "$RUN_URL" \
            --arg desc "calico-claude · \`$BRANCH\` · \`${SHA:0:7}\`" \
            --argjson color "$color" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: $color}]}' \
          | curl -sfS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
