name: Patch Claude Native

on:
  workflow_dispatch:
    inputs:
      native_version:
        description: "Optional native installer version (for example: 2.1.59). Leave empty for latest."
        required: false
        default: ""
      tag_name:
        description: "Optional release tag override. Use {version} and/or {platform}; if {platform} is omitted, -<platform> is appended."
        required: false
        default: ""
      release_notes:
        description: "Optional Markdown release notes. The workflow appends platform and build metadata."
        required: false
        default: ""
      force:
        description: "Force patch/release even if base platform release exists (uses suffix tags like vX-linux-x64-2)."
        required: false
        default: false
        type: boolean

jobs:
  patch-platform:
    name: Patch ${{ matrix.platform_label }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Patch modules intentionally left un-applied. Referenced by both the Apply
      # and Verify steps so the two stay in lockstep — edit this one line to change
      # the disable set. tool-call-verbose is off by user preference (thinking-only
      # expansion; no bash/read tool-call auto-expansion).
      DISABLED_MODULES: tool-call-verbose
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_label: linux-x64
            runs_on: ubuntu-latest
            release_suffix: linux-x64
            patched_asset_name: claude.native.patched
            needs_codesign: false
            can_execute: true
          - platform_label: linux-arm64
            runs_on: ubuntu-24.04-arm
            release_suffix: linux-arm64
            patched_asset_name: claude.native.patched
            needs_codesign: false
            can_execute: true
          - platform_label: macos-arm64
            runs_on: macos-26
            release_suffix: macos-arm64
            patched_asset_name: claude.native.macos.patched
            needs_codesign: true
            can_execute: true
          - platform_label: windows-x64
            runs_on: windows-latest
            release_suffix: win32-x64
            patched_asset_name: claude.native.windows.patched.exe
            needs_codesign: false
            can_execute: true
          - platform_label: windows-arm64
            runs_on: windows-11-arm
            release_suffix: win32-arm64
            patched_asset_name: claude.native.windows.patched.exe
            needs_codesign: false
            can_execute: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun for live-thinking test
        if: matrix.platform_label == 'macos-arm64'
        uses: oven-sh/setup-bun@v2
        with:
          # 1.4.1 does not exist. setup-bun builds the asset URL from the pin
          # without checking the tag, so it 404s on the download and fails the
          # whole macos-arm64 job at step 4 — before any patching runs, which
          # makes it read like a patcher failure rather than a bad pin. 1.4.0 is
          # the newest published release. The live-thinking test uses only
          # Bun.serve, Bun.spawn and Bun.sleep, all long stable; it was
          # developed and calibrated against 1.3.13 locally.
          bun-version: "1.4.0"

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          npm ci
          npm test
          VERSION="$(node -e "console.log(require('./node_modules/node-lief/package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download native binary
        id: native
        run: |
          set -euo pipefail

          VERSION_ARGS=()
          if [ -n "${{ github.event.inputs.native_version }}" ]; then
            VERSION_ARGS=(--version "${{ github.event.inputs.native_version }}")
          fi

          if [ "${#VERSION_ARGS[@]}" -gt 0 ]; then
            bash scripts/download-native-from-installer.sh \
              --platform "${{ matrix.release_suffix }}" \
              --output work/claude.native.original \
              --manifest-out work/manifest.json \
              "${VERSION_ARGS[@]}"
          else
            bash scripts/download-native-from-installer.sh \
              --platform "${{ matrix.release_suffix }}" \
              --output work/claude.native.original \
              --manifest-out work/manifest.json
          fi

      - name: Check if platform release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || '' }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.native.outputs.version }}"
          PLATFORM_SUFFIX="${{ matrix.release_suffix }}"
          BASE_TAG="v${VERSION}-${PLATFORM_SUFFIX}"

          if [ -n "$TAG_NAME_INPUT" ]; then
            BASE_TAG="${TAG_NAME_INPUT//\{version\}/$VERSION}"

            if [[ "$BASE_TAG" == *"{platform}"* ]]; then
              BASE_TAG="${BASE_TAG//\{platform\}/$PLATFORM_SUFFIX}"
            elif [[ "$BASE_TAG" != *"-$PLATFORM_SUFFIX" ]]; then
              BASE_TAG="${BASE_TAG}-$PLATFORM_SUFFIX"
            fi
          fi

          TAG="$BASE_TAG"
          TITLE="claude-code native ${VERSION} (${PLATFORM_SUFFIX})"

          if gh release view "$BASE_TAG" > /dev/null 2>&1; then
            if [ "$FORCE_RELEASE" = "true" ]; then
              SUFFIX=2
              TAG="${BASE_TAG}-${SUFFIX}"
              while gh release view "$TAG" > /dev/null 2>&1; do
                SUFFIX=$((SUFFIX + 1))
                TAG="${BASE_TAG}-${SUFFIX}"
              done

              echo "Release ${BASE_TAG} exists; forcing with tag ${TAG}."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "title=$TITLE (${TAG})" >> "$GITHUB_OUTPUT"
            else
              echo "Release ${BASE_TAG} already exists, skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply display patches to native binaries
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          NEEDS_CODESIGN="${{ matrix.needs_codesign }}"
          CAN_EXECUTE="${{ matrix.can_execute }}"

          node scripts/patch-native.ts \
            --input work/claude.native.original \
            --output "$PATCHED_PATH" \
            --disable "$DISABLED_MODULES" \
            --assert-all
          chmod +x "$PATCHED_PATH"

          if [ "$NEEDS_CODESIGN" = "true" ]; then
            codesign -f -s - "$PATCHED_PATH"
          fi

          if [ "$CAN_EXECUTE" = "true" ]; then
            "$PATCHED_PATH" --version | tee work/version.txt
            grep -F "(patched)" work/version.txt
          else
            echo "Skipping runtime check for non-native runner architecture."
            node -e "const native = require('./scripts/native-bun.ts'); const content = native.readNativeBunContent(process.argv[1]); if (!content.includes('}.VERSION} (Claude Code)\\\\n(patched)')) { console.error('Patched version marker not found in extracted bundle'); process.exit(1); }" "$PATCHED_PATH"
          fi

      - name: Verify patched bundle
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          node scripts/verify-patched-binary.ts --input "$PATCHED_PATH" --disable "$DISABLED_MODULES"

      - name: PTY smoke test (non-Windows)
        id: pty
        if: steps.check.outputs.skip != 'true' && !startsWith(matrix.platform_label, 'windows')
        run: |
          set -uo pipefail

          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          OUT="work/pty-smoke.raw.log"
          CLEAN="work/pty-smoke.clean.log"
          CONFIG_DIR="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR="$CONFIG_DIR"

          # Seed onboarding and folder-trust state so the launch reaches the main
          # renderer. Without this the TUI stops at the theme picker and the
          # fullscreen renderer never mounts, which is where a 2.1.245 build died
          # with "__cc_streamingThinkingSelector is not defined" while this smoke
          # test still passed: an injected helper had landed in the wrong Bun
          # chunk, and nothing before the main renderer touches it.
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              hasCompletedOnboarding: true,
              theme: "dark",
              numStartups: 9,
              installMethod: "native",
              projects: {
                [process.argv[2]]: {
                  hasTrustDialogAccepted: true,
                  hasCompletedProjectOnboarding: true,
                  allowedTools: [],
                  history: [],
                },
              },
            }));
          ' "$CONFIG_DIR/.claude.json" "$PWD"

          # Launch the patched TUI under a pseudo-terminal so the welcome banner
          # renders. BSD (macOS) and util-linux `script` take different arguments.
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q "$OUT" "$PATCHED_PATH" &
          else
            script -qec "$PATCHED_PATH" "$OUT" &
          fi
          PTY_PID=$!

          sleep 12

          # The TUI runs as the child of the `script` wrapper. Check/kill it via
          # its parent pid: matching on the binary path (pkill -f) also matches
          # the wrapper's own cmdline and kills it before it flushes the
          # typescript file, leaving the capture empty.
          TUI_PIDS="$(pgrep -P "$PTY_PID" 2>/dev/null || true)"
          if [ -n "$TUI_PIDS" ]; then
            ALIVE=1
          else
            ALIVE=0
          fi

          # Kill only the TUI and let `script` exit on its own so it flushes.
          if [ -n "$TUI_PIDS" ]; then
            kill $TUI_PIDS 2>/dev/null || true
          fi
          for _ in $(seq 1 20); do
            kill -0 "$PTY_PID" 2>/dev/null || break
            sleep 0.5
          done
          kill "$PTY_PID" 2>/dev/null || true
          wait "$PTY_PID" 2>/dev/null || true

          # Strip common ANSI/OSC escape sequences before matching visible text.
          perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\e\][^\a]*(?:\a|\e\\)//g; s/\e[()][A-Za-z0-9]//g' "$OUT" > "$CLEAN" 2>/dev/null || cp "$OUT" "$CLEAN"

          echo "process_alive=$ALIVE"
          echo "----- cleaned pty output (first 40 lines) -----"
          head -n 40 "$CLEAN" || true
          echo "-----------------------------------------------"

          if [ "$ALIVE" != "1" ]; then
            echo "PTY smoke test failed: patched binary exited before 12s." >&2
            exit 1
          fi

          # Match the full brand string. The TUI separates words with
          # cursor-column escapes (raw: `Calico^[[19GClaude`), so after the ANSI
          # strip above the two words collapse to `CalicoClaude` with no space.
          # Tolerate both the spaced and unspaced forms.
          # -a: the pty capture may contain control bytes that trip binary detection.
          if ! grep -aqiE "Calico ?Claude" "$CLEAN"; then
            echo "PTY smoke test failed: 'Calico Claude' branding not found in TUI output." >&2
            exit 1
          fi

          # Branding alone renders before the main renderer mounts. The shortcut
          # hint is drawn by the main renderer's status line, so it is what
          # proves the fullscreen UI actually came up.
          if ! grep -aqiE "for ?shortcuts" "$CLEAN"; then
            echo "PTY smoke test failed: main renderer did not mount (no status-line hint)." >&2
            exit 1
          fi

          echo "PTY smoke test passed."

      - name: Upload PTY smoke output on failure
        if: failure() && steps.pty.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pty-smoke-${{ matrix.release_suffix }}
          path: |
            work/pty-smoke.raw.log
            work/pty-smoke.clean.log
          if-no-files-found: ignore

      - name: Windows smoke test
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform_label, 'windows')
        run: |
          set -euo pipefail
          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          "$PATCHED_PATH" --version | tee work/version.txt
          grep -F "(patched)" work/version.txt
          "$PATCHED_PATH" --help > work/help.txt
          echo "Windows smoke test passed."

      - name: E2E test (optional, requires ANTHROPIC_API_KEY)
        if: steps.check.outputs.skip != 'true' && env.HAS_ANTHROPIC_KEY == 'true' && !startsWith(matrix.platform_label, 'windows')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          CONFIG_DIR="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR="$CONFIG_DIR"
          OUT="$("$PATCHED_PATH" --print --model claude-3-5-haiku-latest "Reply with the single word: pong")"
          echo "e2e output: $OUT"
          if [ -z "$OUT" ]; then
            echo "E2E test failed: empty response from model." >&2
            exit 1
          fi

      - name: Generate checksums
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ASSET="${{ matrix.patched_asset_name }}"
          cd work
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > checksums.txt
          else
            shasum -a 256 "$ASSET" > checksums.txt
          fi
          cat checksums.txt

      - name: Attest build provenance
        if: steps.check.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: work/${{ matrix.patched_asset_name }}
      - name: Test live thinking without credentials
        if: steps.check.outputs.skip != 'true' && matrix.platform_label == 'macos-arm64'
        env:
          CLAUDE_NATIVE_BINARY: work/${{ matrix.patched_asset_name }}
        run: bun test test/live-thinking.integration.test.ts

      - name: Write metadata
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          {
            echo "platform=${{ matrix.release_suffix }}"
            echo "native_install_script=https://claude.ai/install.sh"
            echo "native_version=${{ steps.native.outputs.version }}"
            echo "native_binary_path=${{ steps.native.outputs.path }}"
            echo "node_lief_version=${{ steps.dependencies.outputs.version }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "source_commit=${{ github.sha }}"
            echo "source_ref=${{ github.ref_name }}"
          } > work/metadata.txt

      - name: Create platform release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_notes || '' }}
          NODE_LIEF_VERSION: ${{ steps.dependencies.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.native.outputs.version }}"
          TAG="${{ steps.check.outputs.tag }}"
          TITLE="${{ steps.check.outputs.title }}"
          PATCHED_PATH="work/${{ matrix.patched_asset_name }}"
          NOTES_PATH="work/release-notes.md"

          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > "$NOTES_PATH"
          else
            printf 'Patched native Claude build for source version %s.\n' "$VERSION" > "$NOTES_PATH"
          fi

          printf '\n---\n\n- Platform: %s\n- Source version: %s\n- Patcher: Calico patch suite + node-lief %s\n' \
            "${{ matrix.platform_label }}" \
            "$VERSION" \
            "$NODE_LIEF_VERSION" >> "$NOTES_PATH"

          # --target pins the tag to the commit that actually produced these
          # assets. Without it gh creates the tag on the default branch's head,
          # so a release dispatched from any other ref ends up tagged at code
          # that cannot rebuild it — and the attestation, which records the real
          # run, then contradicts the tag. Every 2.1.238 tag was created this
          # way before this line existed.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES_PATH" \
            work/metadata.txt \
            work/checksums.txt \
            "$PATCHED_PATH"

  # Failure notification to the community Discord's #github channel.
  # This lives INSIDE the pipeline because workflow_run cannot see these runs:
  # the watcher dispatches this workflow with the repo GITHUB_TOKEN, and GitHub
  # suppresses events created by GITHUB_TOKEN-triggered runs (anti-recursion),
  # so a separate workflow_run-triggered notifier never fires for them.
  # Success needs no job here: a successful run publishes releases, and the
  # repo's Discord webhook (push + release events) already announces those.
  notify-failure:
    needs: patch-platform
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set; cannot notify" && exit 1
          fi
          jq -n \
            --arg title "❌ Patch Claude Native #$RUN_NUMBER — failure" \
            --arg url "$RUN_URL" \
            --arg desc "calico-claude · \`$BRANCH\` · \`${SHA:0:7}\`" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15158332}]}' \
          | curl -sfS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
